<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE血氧心率波形仪 三次样条240Hz重采样</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
        body{padding:15px;background:#f5f7fa;min-height:100vh;}
        .container{max-width:800px;margin:0 auto;}
        .card{background:#fff;border-radius:10px;padding:15px;margin-bottom:15px;box-shadow:0 2px 8px #eee;}
        .btn-group{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;}
        button{padding:8px 16px;border:none;border-radius:6px;background:#2196F3;color:#fff;cursor:pointer;transition:0.2s;}
        button:active{opacity:0.8;}
        button:disabled{background:#94b8e8;cursor:not-allowed;opacity:0.7;}
        .data-info{display:flex;gap:20px;margin:10px 0;font-size:18px;font-weight:500;flex-wrap:wrap;}
        .sample-rate-info{font-size:16px;color:#222;margin:8px 0;padding:8px;background:#f0f7ff;border-radius:6px;}
        canvas{width:100%;height:500px;border:1px solid #ddd;border-radius:6px;background:#000;display:block;}
        .canvas-wrap{margin:10px 0;}
        .canvas-title{margin:8px 0;color:#666;font-size:14px;}
        .log-box{height:120px;overflow:auto;border:1px solid #eee;padding:8px;margin-top:10px;font-size:13px;white-space:pre-wrap;}
        h3,h4{margin-bottom:10px;color:#333;}
        .control-row{margin:8px 0;display:flex;align-items:center;gap:10px;}
        .control-row input{flex:1;}
        .api-result{margin-top:10px;padding:10px;border:1px solid #ccc;border-radius:6px;min-height:80px;white-space:pre-wrap;font-size:13px;}
        .collect-tip{color:#f56c6c;font-weight:bold;margin:8px 0;}
        .progress-wrap{margin:12px 0;}
        .progress-bar{width:100%;height:18px;background:#e8e8e8;border-radius:9px;overflow:hidden;}
        .progress-inner{height:100%;width:0%;background:#409eff;transition:linear 0.5s;}
        .progress-text{margin-top:5px;font-size:14px;color:#666;}
        .warn-tip{color:#e6a23c;padding:8px;background:#fffbeb;border-radius:6px;margin-bottom:10px;}
    </style>
</head>
<body>
<div class="container">
    <div class="warn-tip">
        ⚠️ 注意：Web蓝牙仅支持 <b>Chrome / Edge</b> 浏览器，且必须使用 <b>HTTPS 或本地 localhost</b> 环境！
    </div>

    <div class="card">
        <h3>BLE蓝牙设备连接</h3>
        <div class="btn-group">
            <button id="connectBtn">连接设备</button>
            <button id="disconnectBtn" disabled>断开连接</button>
        </div>
        <div>连接状态：<span id="connStatus" style="color:red;">未连接</span></div>
    </div>

    <div class="card">
        <h3>数据指标</h3>
        <div class="data-info">
            <div>心率：<span id="heartRate">0</span> bpm</div>
            <div>血氧：<span id="spo2">0</span> %</div>
        </div>
        <div class="sample-rate-info">
            瞬时采样率：<span id="instSampleRate">0</span> Hz
            &nbsp;&nbsp;平均采样率：<span id="avgSampleRate">0</span> Hz
        </div>
        <div class="collect-tip" id="collectTip"></div>
        <div class="progress-wrap">
            <div class="progress-bar">
                <div class="progress-inner" id="progressInner"></div>
            </div>
            <div class="progress-text" id="progressText">采集进度：0% | 剩余 00:00</div>
        </div>
        <div class="btn-group">
            <button id="startSpo2Btn" disabled>开始血氧采集</button>
            <button id="startWaveBtn" disabled>开始原始波形采集</button>
            <button id="stopBtn" disabled>停止采集</button>
            <button id="powerOffBtn" disabled>设备关机</button>
            <button id="collect5MinBtn" disabled>采集2分钟波形并上传分析</button>
        </div>
    </div>

    <div class="card">
        <h3>实时采集波形（右→左滚动）</h3>
        <div class="control-row">
            <span>波形振幅：</span>
            <input type="range" id="ampSlider" min="0.1" max="2" step="0.05" value="0.1">
            <span id="ampValue">0.10</span>
        </div>
        <div class="control-row">
            <span>X轴步长：</span>
            <input type="range" id="xStepSlider" min="1" max="10" step="1" value="1">
            <span id="xStepValue">1</span>
        </div>
        <div class="control-row">
            <span>Y轴步长：</span>
            <input type="range" id="yStepSlider" min="1" max="200" step="1" value="80">
            <span id="yStepValue">80</span>
        </div>
        <div class="control-row">
            <span>一阶滤波强度：</span>
            <input type="range" id="filterSlider" min="0" max="1" step="0.01" value="0.3">
            <span id="filterValue">0.30</span>
        </div>
        <div class="control-row">
            <span>垂直补偿步长：</span>
            <input type="range" id="offsetStepSlider" min="1" max="1000" step="1" value="1">
            <span id="offsetStepValue">1</span>
        </div>
        <div class="control-row">
            <span>垂直补偿值：</span>
            <input type="range" id="offsetSlider" min="0" max="65536" step="1" value="32768">
            <span id="offsetValue">32768</span>
        </div>
        <div class="canvas-wrap">
            <canvas id="waveCanvas"></canvas>
        </div>
    </div>

    <div class="card">
        <h3>接口返回解析波形</h3>
        <div class="canvas-wrap">
            <canvas id="returnWaveCanvas"></canvas>
        </div>
    </div>

    <div class="card">
        <h4>日志输出</h4>
        <div class="log-box" id="logBox"></div>
    </div>

    <div class="card">
        <h4>API接口返回结果</h4>
        <div class="api-result" id="apiResultBox">暂无数据</div>
    </div>
</div>

<script>
const FRAME_HEAD = 0x5A;
const FRAME_TAIL = 0xA5;
const CMD_HEART_BEAT = 0x00;
const CMD_SPO2_COLLECT = 0x01;
const CMD_RAW_LIGHT_COLLECT = 0x02;
const CMD_STOP = 0x03;
const CMD_POWER_OFF = 0x04;

const MODE_STOP = 0;
const MODE_SPO2 = 1;
const MODE_RAW_LIGHT = 2;

const SERVICE_UUID    = "0000ffe0-0000-1000-8000-00805f9b34fb";
const CHAR_WRITE_UUID = "0000ffe2-0000-1000-8000-00805f9b34fb";
const CHAR_READ_UUID  = "0000ffe1-0000-1000-8000-00805f9b34fb";

// ===================== 波形异常过滤配置 =====================
const ADC_MIN = 0;
const ADC_MAX = 65535;
const MAX_JUMP_DELTA = 8000;
let errorCount = 0;
const MAX_CONTINUE_ERROR = 5;

// ===================== 直流偏置 & 基线漂移抑制配置 =====================
const BASELINE_WINDOW = 120;
const BASELINE_FILTER_ALPHA = 0.02;
const DRAW_CENTER = 0;
let baselineQueue = [];
let smoothBaseline = 0;
// =================================================================

let bleDevice = null, bleServer = null, writeChar = null, readChar = null;
let collectMode = MODE_STOP;
let rawBuffer = new Uint8Array(0);
let wavePoints = [];
let filterPoints = [];
const MAX_POINT = 600;

let heartRate = 0, spo2 = 0;
let isSending = false;

const COLLECT_DURATION = 2 * 60 * 1000;
let isCollecting5Min = false;
let collect5MinTimer = null;
let progressUpdateTimer = null;
let collectStartTime = 0;
let fullWaveData = [];

// 振幅初始值改为 0.1
let amplitudeRatio = 0.1;
let xStep = 1;
let yStep = 80;
let filterAlpha = 0.3;
let offsetStep = 1;
let verticalBaseOffset = 32768;

let heartBeatTimer = null;
const HEART_BEAT_INTERVAL = 60 * 1000;

let sampleCount = 0;
let sampleStartTime = 0;
let lastCalcTime = 0;
let instantSampleRate = 0;
let avgSampleRate = 0;

const canvas = document.getElementById('waveCanvas');
const ctx = canvas.getContext('2d');
const returnCanvas = document.getElementById('returnWaveCanvas');
const returnCtx = returnCanvas.getContext('2d');

const instSampleRateDom = document.getElementById('instSampleRate');
const avgSampleRateDom = document.getElementById('avgSampleRate');

let canvasW, canvasH;
let returnCanvasW, returnCanvasH;

const ampSlider = document.getElementById('ampSlider');
const ampValue = document.getElementById('ampValue');
const xStepSlider = document.getElementById('xStepSlider');
const xStepValue = document.getElementById('xStepValue');
const yStepSlider = document.getElementById('yStepSlider');
const yStepValue = document.getElementById('yStepValue');
const filterSlider = document.getElementById('filterSlider');
const filterValue = document.getElementById('filterValue');
const offsetStepSlider = document.getElementById('offsetStepSlider');
const offsetStepValue = document.getElementById('offsetStepValue');
const offsetSlider = document.getElementById('offsetSlider');
const offsetValue = document.getElementById('offsetValue');

const connStatus = document.getElementById('connStatus');
const heartRateDom = document.getElementById('heartRate');
const spo2Dom = document.getElementById('spo2');
const logBox = document.getElementById('logBox');
const apiResultBox = document.getElementById('apiResultBox');
const collectTip = document.getElementById('collectTip');
const progressInner = document.getElementById('progressInner');
const progressText = document.getElementById('progressText');

const connectBtn = document.getElementById('connectBtn');
const disconnectBtn = document.getElementById('disconnectBtn');
const startSpo2Btn = document.getElementById('startSpo2Btn');
const startWaveBtn = document.getElementById('startWaveBtn');
const stopBtn = document.getElementById('stopBtn');
const powerOffBtn = document.getElementById('powerOffBtn');
const collect5MinBtn = document.getElementById('collect5MinBtn');

// 重置基线相关数据
function resetBaseline() {
    baselineQueue = [];
    smoothBaseline = 0;
}

function resetSampleRateStat(){
    sampleCount = 0;
    sampleStartTime = 0;
    lastCalcTime = 0;
    instantSampleRate = 0;
    avgSampleRate = 0;
    instSampleRateDom.innerText = "0";
    avgSampleRateDom.innerText = "0";
}

function updateSampleRateDisplay(){
    instSampleRateDom.innerText = instantSampleRate.toFixed(1);
    avgSampleRateDom.innerText = avgSampleRate.toFixed(1);
}

function countOneSample(){
    const now = Date.now();
    if(sampleStartTime === 0){
        sampleStartTime = now;
        lastCalcTime = now;
    }
    sampleCount++;

    if(now - lastCalcTime >= 500){
        const deltaTime = (now - lastCalcTime) / 1000;
        instantSampleRate = 1 / deltaTime * sampleCount;
        lastCalcTime = now;
        sampleCount = 0;
    }
    const totalTime = (now - sampleStartTime) / 1000;
    if(totalTime > 0){
        avgSampleRate = fullWaveData.length / totalTime;
    }
    updateSampleRateDisplay();
}

function initCanvas(){
    canvasW = canvas.clientWidth;
    canvasH = canvas.clientHeight;
    canvas.width = canvasW;
    canvas.height = canvasH;
    clearWave();

    returnCanvasW = returnCanvas.clientWidth;
    returnCanvasH = returnCanvas.clientHeight;
    returnCanvas.width = returnCanvasW;
    returnCanvas.height = returnCanvasH;
    clearReturnWave();
}
window.addEventListener('resize', initCanvas);
initCanvas();

function resetProgress(){
    progressInner.style.width = "0%";
    progressText.innerText = "采集进度：0% | 剩余 00:00";
}

function updateCollectProgress(){
    if(!isCollecting5Min) return;
    const now = Date.now();
    const elapsed = now - collectStartTime;
    let percent = elapsed / COLLECT_DURATION * 100;
    if(percent > 100) percent = 100;
    const remainMs = COLLECT_DURATION - elapsed;
    const remainMin = Math.floor(remainMs / 60000);
    const remainSec = Math.floor((remainMs % 60000) / 1000);
    const remainTime = `${String(remainMin).padStart(2,'0')}:${String(remainSec).padStart(2,'0')}`;
    progressInner.style.width = percent.toFixed(1) + "%";
    progressText.innerText = `采集进度：${percent.toFixed(1)}% | 剩余 ${remainTime}`;
}

ampSlider.addEventListener('input', function(){
    amplitudeRatio = parseFloat(this.value);
    ampValue.innerText = amplitudeRatio.toFixed(2);
    drawWave(filterPoints);
});
xStepSlider.addEventListener('input', function(){
    xStep = parseInt(this.value);
    xStepValue.innerText = xStep;
    drawWave(filterPoints);
});
yStepSlider.addEventListener('input', function(){
    yStep = parseInt(this.value);
    yStepValue.innerText = yStep;
    drawWave(filterPoints);
});
filterSlider.addEventListener('input', function(){
    filterAlpha = parseFloat(this.value);
    filterValue.innerText = filterAlpha.toFixed(2);
});
offsetStepSlider.addEventListener('input', function(){
    offsetStep = parseInt(this.value);
    offsetStepValue.innerText = offsetStep;
    offsetSlider.step = offsetStep;
});
offsetSlider.addEventListener('input', function(){
    verticalBaseOffset = parseInt(this.value);
    offsetValue.innerText = verticalBaseOffset;
    drawWave(filterPoints);
});

function log(msg){
    const time = new Date().toLocaleTimeString();
    logBox.innerHTML += `[${time}] ${msg}\n`;
    logBox.scrollTop = logBox.scrollHeight;
}

function clearWave(){
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,canvasW,canvasH);
}

function clearReturnWave(){
    returnCtx.fillStyle = '#000';
    returnCtx.fillRect(0,0,returnCanvasW,returnCanvasH);
}

function firstOrderFilter(newVal, oldVal){
    return oldVal + filterAlpha * (newVal - oldVal);
}

/**
 * 计算动态基线 + 去直流偏置 + 抑制漂移
 * @param val 原始滤波后数值
 * @returns 去除基线后的波形值
 */
function removeDCAndDrift(val) {
    baselineQueue.push(val);
    if (baselineQueue.length > BASELINE_WINDOW) {
        baselineQueue.shift();
    }
    let mean = 0;
    for (let v of baselineQueue) mean += v;
    mean = mean / baselineQueue.length;

    smoothBaseline = smoothBaseline + BASELINE_FILTER_ALPHA * (mean - smoothBaseline);
    return val - smoothBaseline;
}

// 绘制波形：新增去直流、抑漂移处理
function drawWave(points){
    if(points.length < 2) return;
    clearWave();
    ctx.strokeStyle = '#00ff44';
    ctx.lineWidth = 1.5;
    ctx.beginPath();

    const displayLen = Math.min(points.length, MAX_POINT);
    const midY = canvasH / 2;
    const stepX = canvasW / displayLen * xStep;
    const scale = (canvasH / yStep) * amplitudeRatio;

    for(let i = 0; i < displayLen; i++){
        const idx = displayLen - 1 - i;
        const rawVal = points[idx];
        const correctedVal = removeDCAndDrift(rawVal);
        const y = midY + (correctedVal - DRAW_CENTER) * scale;

        const x = canvasW - i * stepX;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
}

// 大数据抽稀，防止绘图卡顿
function thinData(arr, maxPoint = 2000) {
    if(arr.length <= maxPoint) return arr;
    const step = Math.ceil(arr.length / maxPoint);
    const res = [];
    for(let i = 0; i < arr.length; i += step){
        res.push(arr[i]);
    }
    return res;
}

function drawReturnWave(waveArr){
    if(!Array.isArray(waveArr) || waveArr.length < 2){
        clearReturnWave();
        return;
    }
    const thinArr = thinData(waveArr, 2000);
    clearReturnWave();
    returnCtx.strokeStyle = '#ff9800';
    returnCtx.lineWidth = 1.5;
    returnCtx.beginPath();

    const len = thinArr.length;
    const midY = returnCanvasH / 2;
    const stepX = returnCanvasW / (len - 1);
    const maxVal = Math.max(...thinArr);
    const minVal = Math.min(...thinArr);
    const range = maxVal - minVal || 1;
    const scale = returnCanvasH / range * 0.8;

    for(let i = 0; i < len; i++){
        const x = i * stepX;
        const val = thinArr[i];
        const y = midY - (val - (minVal + maxVal) / 2) * scale;
        i === 0 ? returnCtx.moveTo(x, y) : returnCtx.lineTo(x, y);
    }
    returnCtx.stroke();
    log(`成功绘制接口返回波形，原始点数：${waveArr.length}，抽稀后：${thinArr.length}`);
}

function concatUint8(a,b){
    const res = new Uint8Array(a.length + b.length);
    res.set(a);
    res.set(b, a.length);
    return res;
}

/**
 * 校验单路波形数值是否合法（范围+突变检测）
 * @param val 当前解析值
 * @returns {boolean} true=合法，false=异常丢弃
 */
function isWaveValueValid(val) {
    if (val < ADC_MIN || val > ADC_MAX) {
        return false;
    }
    if (wavePoints.length > 0) {
        const lastVal = wavePoints[wavePoints.length - 1];
        const delta = Math.abs(val - lastVal);
        if (delta > MAX_JUMP_DELTA) {
            return false;
        }
    }
    return true;
}

function parseData(dataBuf){
    rawBuffer = concatUint8(rawBuffer, dataBuf);

    // 解析心率血氧 4字节帧
    while(true){
        let headIdx = rawBuffer.indexOf(FRAME_HEAD);
        if(headIdx === -1) break;
        let tailIdx = rawBuffer.indexOf(FRAME_TAIL, headIdx);
        if(tailIdx === -1) break;
        const frameLen = tailIdx - headIdx + 1;
        if(frameLen !== 4){
            rawBuffer = rawBuffer.slice(headIdx + 1);
            continue;
        }
        heartRate = rawBuffer[headIdx + 1];
        spo2 = rawBuffer[headIdx + 2];
        heartRateDom.innerText = heartRate;
        spo2Dom.innerText = spo2;
        rawBuffer = rawBuffer.slice(tailIdx + 1);
    }

    // 解析两字节原始波形 + 异常过滤
    if(collectMode === MODE_RAW_LIGHT && rawBuffer.length >= 2){
        const validPair = Math.floor(rawBuffer.length / 2);
        const waveData = rawBuffer.slice(0, validPair * 2);
        rawBuffer = rawBuffer.slice(validPair * 2);

        for(let i = 0; i < waveData.length; i += 2){
            const high = waveData[i];
            const low = waveData[i + 1];
            const val = (high << 8) | low;

            if (!isWaveValueValid(val)) {
                log(`丢弃异常波形值: ${val} (数值越界/突变过大)`);
                errorCount++;
                if(errorCount >= MAX_CONTINUE_ERROR){
                    rawBuffer = new Uint8Array(0);
                    errorCount = 0;
                    log("连续异常数据过多，清空接收缓冲区，重新组包");
                }
                continue;
            }
            errorCount = 0;

            wavePoints.push(val);

            if(isCollecting5Min){
                fullWaveData.push(val);
                countOneSample();
            }

            if(filterPoints.length === 0){
                filterPoints.push(val);
            }else{
                const last = filterPoints[filterPoints.length - 1];
                const filtered = firstOrderFilter(val, last);
                filterPoints.push(filtered);
            }

            if(wavePoints.length > MAX_POINT) wavePoints.shift();
            if(filterPoints.length > MAX_POINT) filterPoints.shift();
        }
        drawWave(filterPoints);
    }
}

// 三次样条插值系数求解
function calcSplineCoeff(x, y) {
    const n = x.length - 1;
    const h = [];
    const alpha = [];
    const l = [];
    const mu = [];
    const z = [];
    const b = [];
    const c = [];
    const d = [];

    for (let i = 0; i < n; i++) {
        h[i] = x[i + 1] - x[i];
    }
    for (let i = 1; i < n; i++) {
        alpha[i] = 3 / h[i] * (y[i + 1] - y[i]) - 3 / h[i - 1] * (y[i] - y[i - 1]);
    }

    l[0] = 1;
    mu[0] = 0;
    z[0] = 0;

    for (let i = 1; i < n; i++) {
        l[i] = 2 * (x[i + 1] - x[i - 1]) - h[i - 1] * mu[i - 1];
        mu[i] = h[i] / l[i];
        z[i] = (alpha[i] - h[i - 1] * z[i - 1]) / l[i];
    }

    l[n] = 1;
    z[n] = 0;
    c[n] = 0;

    for (let j = n - 1; j >= 0; j--) {
        c[j] = z[j] - mu[j] * c[j + 1];
        b[j] = (y[j + 1] - y[j]) / h[j] - h[j] * (c[j + 1] + 2 * c[j]) / 3;
        d[j] = (c[j + 1] - c[j]) / (3 * h[j]);
    }
    return { b, c, d };
}

// 三次样条重采样到240Hz（修复边界）
function cubicSplineResample(originArr, targetHz = 240, originHz = 200) {
    if (originArr.length <= 1) return [...originArr];
    const ratio = targetHz / originHz;
    const n = originArr.length;
    const xOrg = [];
    const yOrg = [];
    for (let i = 0; i < n; i++) {
        xOrg.push(i);
        yOrg.push(originArr[i]);
    }
    const { b, c, d } = calcSplineCoeff(xOrg, yOrg);
    const newLen = Math.floor((n - 1) * ratio) + 1;
    const res = [];
    for (let i = 0; i < newLen; i++) {
        const t = i / ratio;
        let idx = Math.floor(t);
        if (idx >= n - 1) idx = n - 1;
        const dt = t - idx;
        const val = yOrg[idx] + b[idx] * dt + c[idx] * dt ** 2 + d[idx] * dt ** 3;
        res.push(val);
    }
    return res;
}

// 去直流偏置 + 三次样条240Hz重采样 + 映射0~255
function convertTo0_255(arr) {
    if (!arr || arr.length === 0) return [];
    const sum = arr.reduce((acc, cur) => acc + cur, 0);
    const dcBias = sum / arr.length;
    const noBiasArr = arr.map(v => v - dcBias);
    const interpArr = cubicSplineResample(noBiasArr, 240, 200);
    //取消三次样条插值
    //const interpArr=noBiasArr;
    const min = Math.min(...interpArr);
    const max = Math.max(...interpArr);
    if (max === min) {
        return interpArr.map(() => 128);
    }
    return interpArr.map(val => {
        let num = Math.round(((val - min) / (max - min)) * 255);
        return Math.max(0, Math.min(255, num));
    });
}

async function sendCmd(cmd){
    if(!writeChar || isSending) return;
    isSending = true;
    const frame = new Uint8Array([FRAME_HEAD, cmd, FRAME_TAIL]);
    try{
        await writeChar.writeValue(frame);
        log(`下发指令：0x${cmd.toString(16)}`);
    }catch(e){
        log(`指令下发失败：${e.message}`);
    }finally{
        isSending = false;
    }
}

function startHeartBeat(){
    stopHeartBeat();
    sendCmd(CMD_HEART_BEAT);
    heartBeatTimer = setInterval(()=>{
        sendCmd(CMD_HEART_BEAT);
    }, HEART_BEAT_INTERVAL);
    log("已开启60秒自动心跳保活");
}
function stopHeartBeat(){
    if(heartBeatTimer){
        clearInterval(heartBeatTimer);
        heartBeatTimer = null;
        log("已关闭心跳保活");
    }
}

async function connectBLE(){
    if(!navigator.bluetooth){
        alert('当前浏览器不支持Web蓝牙！请使用 Chrome / Edge 新版浏览器，且部署在 HTTPS / localhost 环境');
        return;
    }
    try{
        log('开始搜索BLE蓝牙设备...');
        const device = await navigator.bluetooth.requestDevice({
            filters:[{services:[SERVICE_UUID]}]
        });
        bleDevice = device;
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        const server = await device.gatt.connect();
        bleServer = server;
        const service = await server.getPrimaryService(SERVICE_UUID);

        writeChar = await service.getCharacteristic(CHAR_WRITE_UUID);
        readChar = await service.getCharacteristic(CHAR_READ_UUID);

        await readChar.startNotifications();
        readChar.addEventListener('characteristicvaluechanged', e=>{
            parseData(new Uint8Array(e.target.value.buffer));
        });

        connStatus.innerText = '已连接';
        connStatus.style.color = 'green';
        connectBtn.disabled = true;
        disconnectBtn.disabled = false;
        startSpo2Btn.disabled = false;
        startWaveBtn.disabled = false;
        stopBtn.disabled = false;
        powerOffBtn.disabled = false;
        collect5MinBtn.disabled = false;
        log('蓝牙设备连接成功');
    }catch(err){
        log(`连接异常：${err.message}`);
        resetConnState();
    }
}

function onDisconnected(){
    log('设备已断开蓝牙连接');
    resetConnState();
}

async function disconnectBLE(){
    try{
        if(bleDevice && bleDevice.gatt?.connected){
            await bleDevice.gatt.disconnect();
        }
    }catch(e){}
    resetConnState();
    log('手动断开设备连接');
}

function resetConnState(){
    stopHeartBeat();
    stop5MinCollect();
    bleDevice = null;
    bleServer = null;
    writeChar = null;
    readChar = null;
    collectMode = MODE_STOP;
    wavePoints = [];
    filterPoints = [];
    rawBuffer = new Uint8Array(0);
    fullWaveData = [];
    heartRate = 0;
    spo2 = 0;
    isSending = false;

    resetBaseline();

    heartRateDom.innerText = 0;
    spo2Dom.innerText = 0;
    clearWave();
    clearReturnWave();
    collectTip.innerText = '';
    resetProgress();
    resetSampleRateStat();

    connStatus.innerText = '未连接';
    connStatus.style.color = 'red';
    connectBtn.disabled = false;
    disconnectBtn.disabled = true;
    startSpo2Btn.disabled = true;
    startWaveBtn.disabled = true;
    stopBtn.disabled = true;
    powerOffBtn.disabled = true;
    collect5MinBtn.disabled = true;
}

function stop5MinCollect(){
    isCollecting5Min = false;
    if(collect5MinTimer){
        clearTimeout(collect5MinTimer);
        collect5MinTimer = null;
    }
    if(progressUpdateTimer){
        clearInterval(progressUpdateTimer);
        progressUpdateTimer = null;
    }
    collectTip.innerText = '';
    resetProgress();
}

async function uploadWaveData(){
    log(`2分钟采集完成，原始采样点数：${fullWaveData.length}`);
    log(`本次采集原始平均采样率：${avgSampleRate.toFixed(1)} Hz`);
    apiResultBox.innerText = "请求中，请稍候...";

    const finalWave = convertTo0_255(fullWaveData);
    log(`三次样条插值后240Hz采样点数：${finalWave.length}，已完成去偏置+插值+数值映射`);

    const postData = {
        uid: "",
        paraa: [],
        parab: [],
        parac: finalWave,
        user: {
            sex: 1
        }
    };

    try {
        const res = await fetch("http://101.200.234.162:8199/extapi/getwaveresultnew", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(postData)
        });

        const result = await res.json();
        log("接口调用成功，已获取返回JSON数据");
        apiResultBox.innerText = JSON.stringify(result, null, 2);

        if(result && Array.isArray(result.wave)){
            drawReturnWave(result.wave);
        }else{
            log("返回数据中无有效wave波形数组");
            clearReturnWave();
        }
    } catch (err) {
        log(`接口请求失败：${err.message}`);
        apiResultBox.innerText = `请求异常：${err.message}`;
        clearReturnWave();
        alert("接口调用失败！");
    }
}

async function start5MinCollect(){
    if(isCollecting5Min) return;
    fullWaveData = [];
    resetSampleRateStat();
    resetBaseline();
    isCollecting5Min = true;
    collectStartTime = Date.now();
    resetProgress();

    collectMode = MODE_RAW_LIGHT;
    wavePoints = [];
    filterPoints = [];
    rawBuffer = new Uint8Array(0);
    clearWave();
    clearReturnWave();
    await sendCmd(CMD_RAW_LIGHT_COLLECT);
    startHeartBeat();

    connectBtn.disabled = true;
    disconnectBtn.disabled = true;
    startSpo2Btn.disabled = true;
    startWaveBtn.disabled = true;
    stopBtn.disabled = true;
    powerOffBtn.disabled = true;
    collect5MinBtn.disabled = true;

    collectTip.innerText = "正在2分钟波形采集中";
    log("正式开始2分钟时长原始波形采集");

    progressUpdateTimer = setInterval(updateCollectProgress, 1000);

    collect5MinTimer = setTimeout(async ()=>{
        stop5MinCollect();
        await sendCmd(CMD_STOP);
        collectMode = MODE_STOP;
        log("2分钟采集计时结束，停止设备波形上报");

        disconnectBtn.disabled = false;
        startSpo2Btn.disabled = false;
        startWaveBtn.disabled = false;
        stopBtn.disabled = false;
        powerOffBtn.disabled = false;
        collect5MinBtn.disabled = false;

        await uploadWaveData();
    }, COLLECT_DURATION);
}

connectBtn.addEventListener('click', connectBLE);
disconnectBtn.addEventListener('click', disconnectBLE);

startSpo2Btn.addEventListener('click', async ()=>{
    collectMode = MODE_SPO2;
    wavePoints = [];
    filterPoints = [];
    rawBuffer = new Uint8Array(0);
    clearWave();
    resetBaseline();
    await sendCmd(CMD_SPO2_COLLECT);
    startHeartBeat();
    log('切换至血氧心率采集模式');
});

startWaveBtn.addEventListener('click', async ()=>{
    collectMode = MODE_RAW_LIGHT;
    wavePoints = [];
    filterPoints = [];
    rawBuffer = new Uint8Array(0);
    clearWave();
    resetBaseline();
    await sendCmd(CMD_RAW_LIGHT_COLLECT);
    startHeartBeat();
    log('切换至原始波形采集模式');
});

stopBtn.addEventListener('click', async ()=>{
    collectMode = MODE_STOP;
    stopHeartBeat();
    stop5MinCollect();
    resetBaseline();
    await sendCmd(CMD_STOP);
    log('停止全部数据采集');
});

powerOffBtn.addEventListener('click', async ()=>{
    stopHeartBeat();
    stop5MinCollect();
    resetBaseline();
    await sendCmd(CMD_POWER_OFF);
    log('下发设备关机指令');
    setTimeout(disconnectBLE, 1200);
});

collect5MinBtn.addEventListener('click', start5MinCollect);
</script>
</body>
</html>
