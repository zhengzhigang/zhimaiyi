<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态波形绘制 · Canvas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b1a2f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
        }
        .card {
            background: #102a3f;
            border-radius: 32px;
            padding: 24px 24px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(90, 180, 255, 0.15);
            backdrop-filter: blur(2px);
            transition: box-shadow 0.3s;
            max-width: 900px;
            width: 100%;
        }
        .card:hover {
            box-shadow: 0 24px 48px rgba(0, 20, 40, 0.8), 0 0 0 1px rgba(120, 200, 255, 0.3);
        }
        .canvas-wrapper {
            background: #04111e;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.7);
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 800 / 300;
            background: #04111e;
            cursor: default;
            transition: filter 0.2s;
        }
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            color: #a0d0f0;
            font-weight: 400;
            letter-spacing: 0.3px;
            padding: 0 6px;
            flex-wrap: wrap;
            gap: 8px 12px;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #0e2335;
            padding: 6px 18px 6px 14px;
            border-radius: 40px;
            border: 1px solid #2a4b66;
            font-size: 0.9rem;
        }
        .status-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #3ddc84;
            box-shadow: 0 0 8px #3ddc84;
            transition: 0.2s;
        }
        .status-dot.paused {
            background: #f9a825;
            box-shadow: 0 0 8px #f9a825;
        }
        .progress-text {
            background: #0b1f30;
            padding: 4px 16px;
            border-radius: 40px;
            border: 1px solid #2a5a7a;
            font-variant-numeric: tabular-nums;
            font-size: 0.95rem;
            color: #b8defa;
        }
        .badge {
            color: #7bb3d9;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .badge span {
            background: #1b3a52;
            padding: 2px 12px;
            border-radius: 30px;
            color: #c5e2ff;
        }
        @media (max-width: 500px) {
            .card { padding: 16px; }
            .info-bar { flex-direction: column; align-items: stretch; }
            .status { justify-content: center; }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="canvas-wrapper">
        <canvas id="waveCanvas" width="800" height="300"></canvas>
    </div>
    <div class="info-bar">
        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusLabel">绘制中</span>
        </div>
        <div class="progress-text">
            <span id="progressPercent">0%</span>
        </div>
        <div class="badge">
            ⏱ <span id="cycleCount">0</span> 周期
        </div>
    </div>
</div>

<script>
    (function() {
        // ----- 获取元素 -----
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const progressPercent = document.getElementById('progressPercent');
        const cycleCountEl = document.getElementById('cycleCount');

        // ----- 固定尺寸 (逻辑像素) -----
        const WIDTH = 800;
        const HEIGHT = 300;
        canvas.width = WIDTH;
        canvas.height = HEIGHT;

        // ----- 绘制参数 (单次绘制耗时 3 秒) -----
        const DRAW_DURATION = 3000;          // 3 秒 (毫秒)
        const AMPLITUDE = 80;                // 振幅 (像素)
        const BASE_Y = HEIGHT / 2;           // 基线 (150)
        const WAVE_LENGTH = 180;             // 波长 (像素) ～ 影响波形疏密

        // ----- 数据模拟 (mock) -----
        // 使用两个不同频率的正弦波叠加，并加入微小的随机扰动，使波形更自然
        function mockWaveValue(x) {
            // x 为 0 ~ WIDTH 之间的像素位置
            const t = x / WIDTH;   // 0..1
            // 主频 1.8 周期 + 次频 3.4 周期 + 弱随机抖动
            const main = Math.sin(t * 2 * Math.PI * 1.8);
            const sub = Math.sin(t * 2 * Math.PI * 3.4 + 0.7) * 0.35;
            const noise = Math.sin(t * 37.2) * 0.08;   // 高频小扰动
            return main + sub + noise;
        }

        // ----- 状态变量 -----
        let animationId = null;
        let startTime = null;          // 当前绘制周期的起始时间 (performance.now)
        let currentCycle = 0;          // 已完成周期计数
        let progress = 0;             // 0..1, 当前周期绘制进度

        // 是否正在运行 (默认启动)
        let isRunning = true;

        // ----- 绘制函数 (核心) -----
        function drawWave(progressRatio) {
            // 清除画布
            ctx.clearRect(0, 0, WIDTH, HEIGHT);

            // ----- 1. 绘制网格辅助 (极淡) -----
            ctx.save();
            ctx.strokeStyle = 'rgba(70, 140, 200, 0.08)';
            ctx.lineWidth = 0.6;
            for (let y = 40; y < HEIGHT; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(WIDTH, y);
                ctx.stroke();
            }
            for (let x = 40; x < WIDTH; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, HEIGHT);
                ctx.stroke();
            }
            ctx.restore();

            // ----- 2. 绘制基线 (半透明) -----
            ctx.save();
            ctx.strokeStyle = 'rgba(130, 200, 255, 0.2)';
            ctx.lineWidth = 1.2;
            ctx.setLineDash([6, 10]);
            ctx.beginPath();
            ctx.moveTo(0, BASE_Y);
            ctx.lineTo(WIDTH, BASE_Y);
            ctx.stroke();
            ctx.restore();

            // ----- 3. 计算当前可见波形范围 (从左到右逐步绘制) -----
            // visibleWidth = 总宽度 * progressRatio  (0 ~ WIDTH)
            const visibleWidth = WIDTH * progressRatio;

            // 如果进度为0，不绘制任何波形 (但保留背景)
            if (visibleWidth <= 0) {
                // 仍然绘制一个起始点 (美观)
                ctx.save();
                ctx.fillStyle = '#7fc9ff';
                ctx.shadowColor = '#3a9eff';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(0, BASE_Y, 3, 0, 2 * Math.PI);
                ctx.fill();
                ctx.restore();
                return;
            }

            // ----- 4. 绘制波形 (主路径) -----
            // 准备路径: 从左边界到 visibleWidth
            ctx.save();
            ctx.beginPath();

            // 计算起始点 (x=0 处的 y)
            const startY = BASE_Y - AMPLITUDE * mockWaveValue(0);
            ctx.moveTo(0, startY);

            // 步长: 1 像素 (保证平滑)
            const step = 1.0;
            // 为了性能，在像素级绘制，但使用小步长，波形连续
            for (let x = 0; x <= visibleWidth; x += step) {
                // 限制 x 不超过 WIDTH
                const clampedX = Math.min(x, WIDTH);
                // 获取归一化位置 0~1
                const normalized = clampedX / WIDTH;
                // 计算 y 偏移: 使用 mock 数据 + 振幅缩放
                const value = mockWaveValue(clampedX);
                const y = BASE_Y - AMPLITUDE * value;
                ctx.lineTo(clampedX, y);
            }

            // 设置样式: 发光渐变线条
            const gradient = ctx.createLinearGradient(0, 0, WIDTH, 0);
            gradient.addColorStop(0, '#6bc5ff');
            gradient.addColorStop(0.3, '#3fa0f0');
            gradient.addColorStop(0.7, '#2b8ad9');
            gradient.addColorStop(1, '#1a6bb0');
            ctx.strokeStyle = gradient;
            ctx.lineWidth = 2.8;
            ctx.shadowColor = '#4bb0ff';
            ctx.shadowBlur = 18;
            ctx.stroke();

            // 额外光晕 (细亮线)
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#3a9eff';
            ctx.lineWidth = 1.2;
            ctx.strokeStyle = 'rgba(180, 225, 255, 0.6)';
            ctx.stroke();

            ctx.restore();

            // ----- 5. 绘制波形的端点 (亮光圆点) -----
            if (visibleWidth > 2) {
                const endX = Math.min(visibleWidth, WIDTH);
                const endValue = mockWaveValue(endX);
                const endY = BASE_Y - AMPLITUDE * endValue;

                ctx.save();
                // 发光圆点
                const gradientDot = ctx.createRadialGradient(endX, endY, 2, endX, endY, 18);
                gradientDot.addColorStop(0, '#ffffff');
                gradientDot.addColorStop(0.3, '#9ad4ff');
                gradientDot.addColorStop(1, 'rgba(60, 160, 255, 0)');
                ctx.fillStyle = gradientDot;
                ctx.shadowColor = '#5bb0ff';
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.arc(endX, endY, 16, 0, 2 * Math.PI);
                ctx.fill();

                // 中心白点
                ctx.shadowBlur = 18;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(endX, endY, 4, 0, 2 * Math.PI);
                ctx.fill();

                ctx.restore();
            }

            // ----- 6. 绘制起点标记 (小光晕) -----
            ctx.save();
            const startVal = mockWaveValue(0);
            const startY2 = BASE_Y - AMPLITUDE * startVal;
            ctx.shadowColor = '#6bc5ff';
            ctx.shadowBlur = 12;
            ctx.fillStyle = 'rgba(140, 210, 255, 0.7)';
            ctx.beginPath();
            ctx.arc(0, startY2, 3.5, 0, 2 * Math.PI);
            ctx.fill();
            ctx.restore();
        }

        // ----- 动画循环 (基于时间驱动) -----
        function animationLoop(timestamp) {
            if (!isRunning) {
                // 如果暂停，继续请求下一帧但什么也不做 (保持显示)
                animationId = requestAnimationFrame(animationLoop);
                return;
            }

            // 初始化起始时间
            if (startTime === null) {
                startTime = timestamp;
            }

            // 计算当前周期已经过时间 (毫秒)
            const elapsed = timestamp - startTime;
            // 计算进度 (0 ~ 1)
            let rawProgress = Math.min(elapsed / DRAW_DURATION, 1.0);
            progress = rawProgress;

            // 绘制当前帧
            drawWave(progress);

            // 更新UI信息
            const percent = Math.round(progress * 100);
            progressPercent.textContent = `${percent}%`;
            cycleCountEl.textContent = currentCycle;

            // 如果进度达到 1.0，代表一个周期完成
            if (progress >= 1.0) {
                // 增加周期计数
                currentCycle++;
                // 重置起始时间，开始下一个周期
                startTime = timestamp;
                // 更新周期显示 (上面已经更新)
                // 进度归零，但绘制时 progress 会从 0 开始 (下一帧)
                // 注意: 由于 progress 已重置，下一帧会从 0 绘制
                // 但需避免跳帧: 直接标记 progress 为 0
                progress = 0;
                // 重新绘制一次起始状态 (可选)
                drawWave(0);
                // 更新百分比显示
                progressPercent.textContent = '0%';
                // 继续循环
                animationId = requestAnimationFrame(animationLoop);
                return;
            }

            // 未完成，继续下一帧
            animationId = requestAnimationFrame(animationLoop);
        }

        // ----- 启动 / 停止控制 (对外暴露) -----
        function startAnimation() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            // 重置开始时间，让绘制从0开始
            startTime = null;
            progress = 0;
            isRunning = true;
            statusDot.className = 'status-dot';
            statusLabel.textContent = '绘制中';
            // 立刻绘制一帧 (从0开始)
            drawWave(0);
            progressPercent.textContent = '0%';
            // 启动循环
            animationId = requestAnimationFrame(animationLoop);
        }

        function pauseAnimation() {
            if (!isRunning) return;
            isRunning = false;
            statusDot.className = 'status-dot paused';
            statusLabel.textContent = '暂停';
            // 保留当前画面，继续接收 RAF 但不更新绘制
        }

        function resumeAnimation() {
            if (isRunning) return;
            // 恢复时重置 startTime 为当前时间，避免跳跃
            startTime = performance.now();
            isRunning = true;
            statusDot.className = 'status-dot';
            statusLabel.textContent = '绘制中';
            // 如果 animationId 存在，不需要额外操作，循环会继续
        }

        // 点击画布切换 暂停/继续 (交互)
        canvas.addEventListener('click', function() {
            if (isRunning) {
                pauseAnimation();
            } else {
                resumeAnimation();
            }
        });

        // 附加: 窗口失焦时自动暂停? (可选) 为了演示不添加自动暂停

        // ----- 初始化启动 -----
        startAnimation();

        // 清理 (页面卸载时取消动画)
        window.addEventListener('beforeunload', function() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
        });

        // 暴露控制到全局以便调试 (可选)
        window.__waveControls = { startAnimation, pauseAnimation, resumeAnimation };

        // 在控制台可执行: __waveControls.pauseAnimation() 或 resumeAnimation()
        // 也可点击画布切换

        console.log('✅ 波形绘制已启动 (单击画布暂停/继续)');
        console.log('📐 单次绘制耗时 3 秒, 周期计数会累加');
    })();
</script>
</body>
</html>
